# SHIM — not a source of truth.
# Canonical Alembic entrypoint is the repo-root alembic.ini
# (`alembic -c alembic.ini upgrade heads` from /opt/HostFlow).
# This file exists so leftover `cd backend && alembic` callers still
# resolve script_location to backend/alembic. Do not add options here.

[alembic]
script_location = alembic
timezone = UTC
output_encoding = utf-8

# ВНИМАНИЕ: это резервный URL для Alembic.
# В реальном окружении будет переопределён переменными окружения
# (SYNC_DATABASE_URL/DATABASE_URL/ALEMBIC_DATABASE_URL) или из app.core.settings.
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s