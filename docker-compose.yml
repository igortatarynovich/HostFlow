services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostflow
      POSTGRES_PASSWORD: hostflow
      POSTGRES_DB: hostflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostflow -d hostflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      - ASYNC_DATABASE_URL=postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      - SYNC_DATABASE_URL=postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      - UVICORN_WORKERS=1
      - REDIS_URL=redis://redis:6379/0
      # Caddy is one hop; without this every browser shares the proxy IP → global 429.
      - TRUSTED_PROXY_HOPS=1
      # Live SMTP for questionnaire email staging acceptance (tenant_email_config).
      - EMAIL_DELIVERY_MODE=live
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend:/app
      # ADR-023 SSOT — cookie domain / module hosts (also at /app/shared via path fallback)
      - ./shared:/shared:ro
      - ./shared:/app/shared:ro
      # раздача собранного фронта Vite через FastAPI StaticFiles
      - ./hostflow-frontend/dist:/app/public:ro
      # Mount samples for template extraction
      - ./samples:/opt/HostFlow/samples:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Background worker that drains Stripe webhooks, outgoing comms and
  # automation triggers from Redis. Activate by setting JOB_QUEUE_BACKEND=arq
  # on `backend` AND starting this service (e.g. via profile: `arq-worker`).
  arq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      - ASYNC_DATABASE_URL=postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      - SYNC_DATABASE_URL=postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      - REDIS_URL=redis://redis:6379/0
      - JOB_QUEUE_BACKEND=arq
      - EMAIL_DELIVERY_MODE=mock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq backend.app.core.arq_worker.WorkerSettings
    volumes:
      - ./backend:/app
      - ./shared:/shared:ro
      - ./shared:/app/shared:ro
      - ./samples:/opt/HostFlow/samples:ro
    profiles: ["arq", "full"]

  # S3-compatible object storage for document uploads, presigned reads and
  # future tenant-branding assets. Default setup uses MinIO in single-node mode;
  # point `OBJECT_STORAGE_BACKEND=s3` + MINIO_* env vars on `backend`/`arq-worker`
  # (or AWS S3 credentials in production) to activate. Run the one-time migration
  # `python -m backend.scripts.migrate_uploads_to_s3` to lift existing uploads
  # into the bucket. Activated via profile: `minio` or `full`.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hostflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-hostflow-minio}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    profiles: ["minio", "full"]

  # Creates the HostFlow bucket on first run so the backend has somewhere to
  # write immediately after `docker compose up`. Safe to re-run.
  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-hostflow} ${MINIO_ROOT_PASSWORD:-hostflow-minio};
      mc mb --ignore-existing local/${OBJECT_STORAGE_BUCKET:-hostflow-uploads};
      mc anonymous set download local/${OBJECT_STORAGE_BUCKET:-hostflow-uploads} || true;
      exit 0;
      "
    profiles: ["minio", "full"]

  caddy:
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Свежий Vite dist без пересборки образа: npm run build → restart caddy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./hostflow-frontend/dist:/var/www/hostflow-frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  minio_data:
