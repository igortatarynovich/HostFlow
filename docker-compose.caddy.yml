services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      # Должно совпадать с root в Caddyfile (/var/www/hostflow-frontend)
      - ./hostflow-frontend/dist:/var/www/hostflow-frontend:ro
    depends_on:
      - backend
