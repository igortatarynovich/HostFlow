      - rpm-cutover-gate
      - rpm-close-gate
      - ma1-contract-gate
      - ma2-resolution-gate
      - ma3-operator-surface
      - dr1-runtime-gate
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a blocking job failed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, payload in sorted(needs.items()):
              print(f"{name}: {payload.get('result')}")
          bad = [
              name
              for name, payload in needs.items()
              if payload.get("result") in ("failure", "cancelled")
          ]
          if bad:
              print("blocking failures: " + ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          PY
