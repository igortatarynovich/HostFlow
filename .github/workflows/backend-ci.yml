name: backend-ci

# PR-path only. Named gates are independent jobs + path filters so a CL1
# slice does not replay Forms C1–C6 / D1–D9 / E1–E7 / R1–R5. Full pytest +
# coverage lives in backend-regression.yml (non-blocking / nightly).
#
# Contract tests grep this file for named-gate titles and test filenames.
# Keep those substrings when adding a gate: add the pytest path to the
# matching family job and keep the human title in a comment or job name.

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/crm_app_paths.json"
      - "shared/crm_app_paths.schema.json"
      - "scripts/codegen/**"
      - "scripts/architecture/**"
      - "scripts/entity_field_composition/**"
      - "docs/specs/gates/**"
      - "docs/specs/tasks/forms-platform*"
      - "docs/specs/tasks/entity-workspace*"
      - "docs/specs/tasks/documents-platform*"
      - "docs/specs/tasks/platform-reference*"
      - "docs/specs/tasks/workspace-capability*"
      - "docs/specs/tasks/entity-field-composition*"
      - "docs/specs/platform/module-stage-registry-recruitment-candidate-v0.json"
      - "docs/specs/tasks/lifecycle-identity-li1*"
      - "docs/specs/tasks/engine-document-request-dr1*"
      - "docs/specs/tasks/requirement-policy-management.md"
      - "docs/specs/architecture/requirement-policy-authority.md"
      - "docs/devel/pr-checklist-adr014-document-access.md"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/backend-pytest/**"
      - "alembic.ini"
      - "scripts/deploy/**"
  push:
    branches:
      - integration/release-product-a-b
    paths:
      - "backend/**"
      - "shared/crm_app_paths.json"
      - "shared/crm_app_paths.schema.json"
      - "scripts/codegen/**"
      - "scripts/architecture/**"
      - "scripts/entity_field_composition/**"
      - "docs/specs/gates/**"
      - "docs/specs/tasks/forms-platform*"
      - "docs/specs/tasks/entity-workspace*"
      - "docs/specs/tasks/documents-platform*"
      - "docs/specs/tasks/platform-reference*"
      - "docs/specs/tasks/workspace-capability*"
      - "docs/specs/tasks/entity-field-composition*"
      - "docs/specs/platform/module-stage-registry-recruitment-candidate-v0.json"
      - "docs/specs/tasks/lifecycle-identity-li1*"
      - "docs/specs/tasks/engine-document-request-dr1*"
      - "docs/specs/tasks/requirement-policy-management.md"
      - "docs/specs/architecture/requirement-policy-authority.md"
      - "docs/devel/pr-checklist-adr014-document-access.md"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/backend-pytest/**"
      - "alembic.ini"
      - "scripts/deploy/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOSTFLOW_ALLOW_NON_TEST_DB: "1"
  HOSTFLOW_SQLALCHEMY_NULL_POOL: "1"

jobs:
  changes:
    name: path filter
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ci == 'true' }}
      shared: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' }}
      guards: ${{ github.event_name != 'pull_request' || steps.filter.outputs.guards == 'true' }}
      alembic: ${{ github.event_name != 'pull_request' || steps.filter.outputs.alembic == 'true' }}
      sales: ${{ github.event_name != 'pull_request' || steps.filter.outputs.sales == 'true' }}
      forms: ${{ github.event_name != 'pull_request' || steps.filter.outputs.forms == 'true' }}
      entity: ${{ github.event_name != 'pull_request' || steps.filter.outputs.entity == 'true' }}
      documents: ${{ github.event_name != 'pull_request' || steps.filter.outputs.documents == 'true' }}
      workspace: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workspace == 'true' }}
      reference: ${{ github.event_name != 'pull_request' || steps.filter.outputs.reference == 'true' }}
      cl1: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl1 == 'true' }}
      cl2: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl2 == 'true' }}
      cl3: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl3 == 'true' }}
      cl4: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl4 == 'true' }}
      cl5: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl5 == 'true' }}
      cl6: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl6 == 'true' }}
      cl7: ${{ github.event_name != 'pull_request' || steps.filter.outputs.cl7 == 'true' }}
      overlay: ${{ github.event_name != 'pull_request' || steps.filter.outputs.overlay == 'true' }}
      li1: ${{ github.event_name != 'pull_request' || steps.filter.outputs.li1 == 'true' }}
      dr1: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dr1 == 'true' }}
      dr1_runtime: ${{ github.event_name != 'pull_request' || steps.filter.outputs.dr1_runtime == 'true' }}
      rpm1: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm1 == 'true' }}
      rpm2: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm2 == 'true' }}
      rpm3a: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm3a == 'true' }}
      rpm3b: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm3b == 'true' }}
      rpm_cutover: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm_cutover == 'true' }}
      rpm_close: ${{ github.event_name != 'pull_request' || steps.filter.outputs.rpm_close == 'true' }}
      ma1: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ma1 == 'true' }}
      ma2: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ma2 == 'true' }}
      ma3: ${{ github.event_name != 'pull_request' || steps.filter.outputs.ma3 == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/backend-ci.yml'
              - '.github/actions/backend-pytest/**'
            shared:
              - 'backend/tests/conftest.py'
              - 'backend/requirements.txt'
              - 'backend/pytest.ini'
              - 'backend/app/**'
              - '!backend/app/forms_platform/**'
              - '!backend/app/reference/**'
              - '!backend/app/modules/documents/**'
              - '!backend/app/modules/sales/**'
              - '!backend/app/modules/client_accounts/**'
            guards:
              - 'backend/app/**'
              - 'backend/scripts/**'
              - 'scripts/codegen/**'
              - 'scripts/architecture/**'
              - 'shared/crm_app_paths.json'
              - 'shared/crm_app_paths.schema.json'
              - 'docs/devel/pr-checklist-adr014-document-access.md'
            alembic:
              - 'alembic.ini'
              - 'backend/alembic.ini'
              - 'backend/alembic/**'
              - 'backend/scripts/check_alembic_heads.py'
              - 'backend/scripts/check_alembic_revision_graph.py'
              - 'backend/scripts/check_stage1a_migrations.py'
              - 'backend/app/models/**'
              - 'scripts/deploy/check_alembic_entrypoint.py'
            sales:
              - 'backend/app/modules/sales/**'
              - 'backend/app/modules/client_accounts/**'
              - 'backend/tests/modules/sales/**'
              - 'backend/tests/modules/client_accounts/**'
              - 'backend/tests/unit/test_sales_inquiry_duplicates.py'
            forms:
              - 'backend/app/forms_platform/**'
              - 'backend/tests/forms_platform/**'
              - 'docs/specs/tasks/forms-platform*'
            entity:
              - 'backend/tests/platform/test_entity_workspace_*'
              - 'docs/specs/tasks/entity-workspace*'
              - 'hostflow-frontend/src/components/ui/EntityWorkspace*'
              - 'hostflow-frontend/src/**/entityWorkspace/**'
              - 'hostflow-frontend/src/**/EntityWorkspace*'
            documents:
              - 'backend/app/modules/documents/**'
              - 'backend/tests/platform/test_documents_e*'
              - 'docs/specs/tasks/documents-platform*'
            workspace:
              - 'backend/tests/platform/test_workspace_capability_*'
              - 'docs/specs/tasks/workspace-capability*'
              - 'docs/specs/gates/workspace-capability*'
            reference:
              - 'backend/app/reference/**'
              - 'backend/tests/platform/test_reference_r*'
              - 'docs/specs/platform/country-registry*'
              - 'docs/specs/platform/*document-type*'
              - 'docs/specs/tasks/platform-reference*'
            cl1:
              - 'scripts/entity_field_composition/**'
              - 'backend/tests/entity_field_composition/test_cl1_inventory_gate.py'
              - 'docs/specs/tasks/entity-field-composition-cl1*'
            cl2:
              - 'backend/app/entity_profile/membership_runtime.py'
              - 'backend/app/entity_profile/manifests/**'
              - 'backend/tests/entity_field_composition/test_cl2_membership_gate.py'
              - 'scripts/architecture/check_entity_profile_membership_boundary.py'
              - 'scripts/architecture/entity_profile_membership_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl2*'
            cl3:
              - 'backend/app/entity_profile/layout_runtime.py'
              - 'backend/tests/entity_field_composition/test_cl3_layout_gate.py'
              - 'scripts/architecture/check_entity_profile_layout_boundary.py'
              - 'scripts/architecture/entity_profile_layout_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl3*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
            cl4:
              - 'backend/app/entity_profile/builder_runtime.py'
              - 'backend/tests/entity_field_composition/test_cl4_builder_gate.py'
              - 'scripts/architecture/check_entity_profile_builder_boundary.py'
              - 'scripts/architecture/entity_profile_builder_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl4*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateCompositionBuilder.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
            cl5:
              - 'backend/app/entity_profile/qa_runtime.py'
              - 'backend/tests/entity_field_composition/test_cl5_qa_gate.py'
              - 'scripts/architecture/check_entity_profile_qa_boundary.py'
              - 'scripts/architecture/entity_profile_qa_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl5*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateQaPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
            cl6:
              - 'backend/app/entity_profile/flight_map_runtime.py'
              - 'backend/tests/entity_field_composition/test_cl6_flight_map_gate.py'
              - 'scripts/architecture/check_entity_profile_flight_map_boundary.py'
              - 'scripts/architecture/entity_profile_flight_map_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl6*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateFlightMapPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateQaPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
            cl7:
              - 'backend/app/entity_profile/engine_eval_runtime.py'
              - 'backend/tests/entity_field_composition/test_cl7_engine_eval_gate.py'
              - 'scripts/architecture/check_entity_profile_engine_eval_boundary.py'
              - 'scripts/architecture/entity_profile_engine_eval_boundary_*'
              - 'docs/specs/tasks/entity-field-composition-cl7*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEngineEvalPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateFlightMapPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateQaPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
            overlay:
              - 'backend/app/entity_profile/vacancy_overlay_runtime.py'
              - 'backend/app/entity_profile/engine_eval_runtime.py'
              - 'backend/tests/entity_field_composition/test_vacancy_overlay_contract_gate.py'
              - 'scripts/architecture/check_entity_profile_vacancy_overlay_boundary.py'
              - 'scripts/architecture/entity_profile_vacancy_overlay_boundary_*'
              - 'docs/specs/tasks/entity-profile-vacancy-overlay*'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEngineEvalPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateFlightMapPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateQaPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
            li1:
              - 'backend/app/platform/module_stage_registry/**'
              - 'backend/tests/platform/test_lifecycle_identity_li1_existence_guard_gate.py'
              - 'scripts/architecture/check_stage_existence_boundary.py'
              - 'scripts/architecture/stage_existence_boundary_*'
              - 'docs/specs/platform/module-stage-registry-recruitment-candidate-v0.json'
              - 'docs/specs/tasks/lifecycle-identity-li1*'
            dr1:
              - 'backend/app/requirement_rules/engine_to_hub_outstanding_ask_contract.py'
              - 'backend/tests/requirement_rules/test_dr1_contract_gate.py'
              - 'scripts/architecture/check_engine_outstanding_ask_boundary.py'
              - 'scripts/architecture/engine_outstanding_ask_boundary_*'
              - 'docs/specs/tasks/engine-document-request-dr1-contract.md'
            dr1_runtime:
              - 'backend/app/requirement_rules/engine_outstanding_ask_runtime.py'
              - 'backend/app/requirement_rules/engine_to_hub_outstanding_ask_contract.py'
              - 'backend/app/services/document_hub_delivery_contract.py'
              - 'backend/app/api/v1/platform/documents_public.py'
              - 'backend/tests/requirement_rules/test_dr1_runtime_gate.py'
              - 'scripts/architecture/check_engine_outstanding_ask_writer_boundary.py'
              - 'scripts/architecture/engine_outstanding_ask_writer_boundary_*'
              - 'docs/specs/tasks/engine-document-request-dr1-runtime.md'
              - 'hostflow-frontend/src/platform/capabilities/documents/DocumentsCapability.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEngineEvalPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateEntityWorkspacePanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateFlightMapPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateQaPanel.tsx'
              - 'hostflow-frontend/src/platform/entity-workspace/CandidateInformationLayout.tsx'
            rpm1:
              - 'backend/app/reference/requirement_policy_authority.py'
              - 'backend/app/reference/document_policy_merge.py'
              - 'backend/tests/platform/test_requirement_policy_authority_gate.py'
              - 'scripts/architecture/check_requirement_policy_authority_boundary.py'
              - 'scripts/architecture/requirement_policy_authority_boundary_*'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'docs/specs/architecture/requirement-policy-authority.md'
            rpm2:
              - 'backend/app/reference/document_policy_overlay_store.py'
              - 'backend/app/api/v1/platform/document_policy_overlay.py'
              - 'backend/app/api/v1/platform/documents_public.py'
              - 'backend/app/models/tenant_document_policy_delta.py'
              - 'backend/alembic/versions/202609030001_tenant_document_policy_delta.py'
              - 'backend/tests/platform/test_requirement_policy_operator_gate.py'
              - 'backend/tests/api/test_document_policy_overlay.py'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'hostflow-frontend/src/pages/admin/RequirementPolicyOverlayPage.tsx'
            rpm3a:
              - 'backend/app/reference/requirement_policy_parallel_authority_retirement.py'
              - 'backend/tests/platform/test_requirement_policy_parallel_authority_retirement_gate.py'
              - 'backend/tests/requirement_rules/test_tenant_overrides_p3b.py'
              - 'backend/app/api/v1/document_policies.py'
              - 'backend/app/api/v1/platform/tenant_requirement_overrides.py'
              - 'backend/app/requirement_rules/tenant_override_source.py'
              - 'backend/app/modules/documents/router.py'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'docs/specs/tasks/sales-to-comms-sequential-queue.md'
              - 'AGENTS.md'
              - 'hostflow-frontend/src/pages/Companies.tsx'
              - 'hostflow-frontend/src/pages/admin/RulesetVersionsPage.tsx'
            rpm3b:
              - 'backend/app/reference/requirement_policy_consumer_parity.py'
              - 'backend/tests/platform/test_requirement_policy_consumer_parity_gate.py'
              - 'backend/app/requirement_rules/registry.py'
              - 'backend/app/requirement_rules/evaluator.py'
              - 'backend/app/requirement_rules/facade.py'
              - 'backend/app/requirement_rules/document_hub_bridge.py'
              - 'backend/app/modules/documents/owner_summary.py'
              - 'backend/app/modules/documents/pack_definitions.py'
              - 'backend/app/modules/documents/router.py'
              - 'backend/app/services/candidate_doc_pipeline_guard.py'
              - 'backend/app/services/document_applicability_resolver.py'
              - 'backend/app/services/transfer_policy_resolver.py'
              - 'backend/app/services/requirement_checker.py'
              - 'backend/app/services/hr_expected_documents_resolver.py'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'docs/specs/tasks/sales-to-comms-sequential-queue.md'
              - 'AGENTS.md'
              - 'hostflow-frontend/src/utils/candidateStageDocPolicy.ts'
            rpm_cutover:
              - 'backend/app/reference/requirement_policy_consumer_cutover.py'
              - 'backend/tests/platform/test_requirement_policy_consumer_cutover_gate.py'
              - 'backend/app/reference/document_policy_overlay_store.py'
              - 'backend/app/api/v1/platform/documents_public.py'
              - 'backend/app/api/public/intake.py'
              - 'backend/app/api/v1/documents.py'
              - 'backend/app/api/v1/communications/_helpers/telegram_intake/docs_bridge.py'
              - 'backend/app/services/candidate_telegram_notifications.py'
              - 'backend/app/services/document_hub_delivery_contract.py'
              - 'backend/app/modules/documents/router.py'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'docs/specs/architecture/requirement-policy-authority.md'
            rpm_close:
              - 'backend/tests/platform/test_requirement_policy_program_close.py'
              - 'docs/specs/tasks/requirement-policy-management.md'
              - 'docs/specs/tasks/mapping-authority.md'
              - 'docs/specs/tasks/sales-to-comms-sequential-queue.md'
              - 'docs/specs/tasks/hiring-workflow-e2e.md'
              - 'docs/specs/tasks/external-intake-forms-publish.md'
              - 'docs/specs/tasks/recruitment-hr-minimal-handoff.md'
              - 'docs/specs/gates/hostflow-v1-release-goal.md'
              - 'AGENTS.md'
            ma1:
              - 'backend/app/reference/mapping_authority.py'
              - 'backend/tests/platform/test_mapping_authority_contract_gate.py'
              - 'scripts/architecture/check_mapping_authority_boundary.py'
              - 'scripts/architecture/mapping_authority_boundary_*'
              - 'docs/specs/tasks/mapping-authority.md'
              - 'docs/specs/architecture/mapping-authority-contract.md'
            ma2:
              - 'backend/app/entity_profile/mapping_resolve.py'
              - 'backend/app/entity_profile/ingest_runtime.py'
              - 'backend/app/modules/leads/field_mapping_resolve.py'
              - 'backend/tests/platform/test_mapping_authority_resolution_gate.py'
              - 'backend/tests/entity_profile/test_mapping_resolve.py'
              - 'docs/specs/tasks/mapping-authority.md'
              - 'docs/specs/architecture/mapping-authority-resolution.md'
              - 'docs/specs/architecture/mapping-authority-contract.md'
            ma3:
              - 'backend/app/acquisition/mapping_workspace.py'
              - 'backend/app/acquisition/sources_mapping.py'
              - 'backend/app/api/v1/platform/marketing_sources.py'
              - 'backend/tests/api/test_acquisition_c5_source_mapping.py'
              - 'hostflow-frontend/src/pages/marketing/MarketingSourceMappingPage.tsx'
              - 'docs/specs/architecture/mapping-authority-operator.md'
              - 'docs/specs/tasks/mapping-authority.md'

  guards:
    name: guards
    needs: changes
    if: needs.changes.outputs.guards == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: CRM app paths codegen drift check
        run: python3 scripts/codegen/generate_crm_app_paths.py --check
      - name: SPA path literals (no stray /app/... in app/)
        run: python3 backend/scripts/check_spa_path_literals.py
      - name: ADR-014 document access guardrails (documents-db module)
        run: python3 backend/scripts/check_adr014_document_access.py
      - name: REF-3.1 facade boundary guard scan
        run: python3 scripts/architecture/check_reference_facade_boundary.py

  alembic:
    name: alembic
    needs: changes
    if: needs.changes.outputs.alembic == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hostflow
          POSTGRES_PASSWORD: hostflow
          POSTGRES_DB: hostflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U hostflow"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@localhost:5432/hostflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic heads guard (must be exactly 1)
        run: python3 backend/scripts/check_alembic_heads.py
      - name: Alembic revision graph (every down_revision present + single head)
        run: python3 backend/scripts/check_alembic_revision_graph.py --with-alembic
      - name: Canonical Alembic entrypoint (repo-root alembic.ini)
        run: python3 scripts/deploy/check_alembic_entrypoint.py
      - name: Alembic upgrade
        env:
          ALEMBIC_DATABASE_URL: postgresql+psycopg://hostflow:hostflow@localhost:5432/hostflow
        run: alembic -c alembic.ini upgrade heads
      - name: Stage 1A migration roundtrip (when present)
        working-directory: backend
        run: |
          if [ -f scripts/check_stage1a_migrations.py ]; then
            python scripts/check_stage1a_migrations.py
          else
            echo "skip: Stage 1A migration checker not in tree"
          fi

  sales-gates:
    name: sales gates
    needs: changes
    if: needs.changes.outputs.sales == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hostflow
          POSTGRES_PASSWORD: hostflow
          POSTGRES_DB: hostflow
        ports: ["5432:5432"]
