name: hr-e2e-api

on:
  push:
    paths:
      - "e2e/**"
      - "backend/app/api/v1/hr/**"
      - "backend/app/api/v1/handoffs.py"
      - "backend/app/api/v1/workforce/**"
      - "backend/app/services/hr_*"
      - "backend/app/services/workforce_*"
      - "backend/app/services/reminder_tasks.py"
      - "backend/scripts/seed_e2e_bootstrap.py"
      - "backend/tests/conftest.py"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/hr-e2e-api.yml"
  pull_request:
    paths:
      - "e2e/**"
      - "backend/app/api/v1/hr/**"
      - "backend/app/api/v1/handoffs.py"
      - "backend/app/api/v1/workforce/**"
      - "backend/app/services/hr_*"
      - "backend/app/services/workforce_*"
      - "backend/app/services/reminder_tasks.py"
      - "backend/scripts/seed_e2e_bootstrap.py"
      - "backend/tests/conftest.py"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/hr-e2e-api.yml"
  workflow_dispatch:

jobs:
  hr-api-e2e:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: hostflow
          POSTGRES_PASSWORD: hostflow
          POSTGRES_DB: hostflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U hostflow"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Alembic upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@localhost:5432/hostflow
        run: alembic upgrade head

      - name: Seed bootstrap users for e2e
        env:
          DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@localhost:5432/hostflow
        run: PYTHONPATH=. python3 backend/scripts/seed_e2e_bootstrap.py

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Start API server
        env:
          DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@localhost:5432/hostflow
        run: |
          cd backend
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../api-e2e.log 2>&1 &
          echo $! > ../api-e2e.pid
          cd ..
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to start"
          cat api-e2e.log || true
          exit 1

      - name: Run HR Playwright API e2e
        env:
          PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:8000/api/v1
        run: npm run e2e:hr

      - name: Stop API server
        if: always()
        run: |
          if [ -f api-e2e.pid ]; then kill "$(cat api-e2e.pid)" || true; fi
          if [ -f api-e2e.log ]; then tail -n 80 api-e2e.log || true; fi
