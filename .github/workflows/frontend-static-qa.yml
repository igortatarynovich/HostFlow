name: frontend-static-qa

on:
  push:
    paths:
      - "hostflow-frontend/**"
      - "shared/crm_app_paths.json"
      - "shared/crm_app_paths.schema.json"
      - "scripts/codegen/**"
      - "hostflow-frontend/scripts/check-foundation-tokens.sh"
      - "hostflow-frontend/scripts/foundation_tokens_lib.py"
      - "hostflow-frontend/scripts/foundation_ratchet_base.py"
      - "hostflow-frontend/scripts/test_foundation_ratchet_base.py"
      - "hostflow-frontend/scripts/check_foundation_tokens_diff.py"
      - "hostflow-frontend/scripts/check_foundation_tokens_scan.py"
      - "hostflow-frontend/scripts/check_ts_import_integrity.py"
      - "scripts/repo_health_gate.py"
      - ".github/workflows/frontend-static-qa.yml"
      - ".github/workflows/security-gates.yml"
      - ".github/pull_request_template.md"
  pull_request:
    paths:
      - "hostflow-frontend/**"
      - "shared/crm_app_paths.json"
      - "shared/crm_app_paths.schema.json"
      - "scripts/codegen/**"
      - "hostflow-frontend/scripts/check-foundation-tokens.sh"
      - "hostflow-frontend/scripts/foundation_tokens_lib.py"
      - "hostflow-frontend/scripts/foundation_ratchet_base.py"
      - "hostflow-frontend/scripts/test_foundation_ratchet_base.py"
      - "hostflow-frontend/scripts/check_foundation_tokens_diff.py"
      - "hostflow-frontend/scripts/check_foundation_tokens_scan.py"
      - "hostflow-frontend/scripts/check_ts_import_integrity.py"
      - "scripts/repo_health_gate.py"
      - ".github/workflows/frontend-static-qa.yml"
      - ".github/workflows/security-gates.yml"
      - ".github/pull_request_template.md"

jobs:
  qa-static:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hostflow-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch push-before SHA for Foundation ratchet
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        working-directory: .
        run: |
          git fetch --no-tags origin "${{ github.event.before }}" \
            || echo "before SHA not fetchable; checker will fail-closed"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Foundation ratchet comparison-base contract
        run: python3 scripts/test_foundation_ratchet_base.py
      - name: CRM app paths codegen drift check
        working-directory: .
        run: python3 scripts/codegen/generate_crm_app_paths.py --check
      - name: SPA path literals (backend/app mirror)
        working-directory: .
        run: python3 backend/scripts/check_spa_path_literals.py
      - name: GIT-IMPORT-INTEGRITY (TS/TSX local imports)
        working-directory: .
        run: python3 hostflow-frontend/scripts/check_ts_import_integrity.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: hostflow-frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Foundation tokens (deprecated in change range)
        run: npm run foundation:check
        env:
          # Ratchet the change that produced this event. Do not default to main.
          # Override locally with FOUNDATION_DIFF_BASE only.
          FOUNDATION_EVENT_NAME: ${{ github.event_name }}
          FOUNDATION_PR_BASE_REF: ${{ github.event.pull_request && github.event.pull_request.base.ref || '' }}
          FOUNDATION_PR_HEAD_REF: ${{ github.event.pull_request && github.event.pull_request.head.ref || '' }}
          FOUNDATION_PR_SAME_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          FOUNDATION_PUSH_BEFORE: ${{ github.event.before || '' }}
          FOUNDATION_PUSH_AFTER: ${{ github.event.after || github.sha }}
          FOUNDATION_PUSH_FORCED: ${{ github.event.forced == true }}
          FOUNDATION_REF_NAME: ${{ github.ref_name }}
      - name: Unit tests with coverage
        run: npm run test:coverage
      - name: Coverage gate (Phase 0 #7 — ratchet)
        run: npm run coverage:check
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: hostflow-frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Static QA gate
        run: npm run qa:static
      - name: Bundle-size budget (Phase 0 #7)
        run: npm run bundle:check
