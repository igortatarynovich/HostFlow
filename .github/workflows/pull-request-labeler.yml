# Авто-метки для навигации по security-периметру (paths → labels).
# Конфиг: .github/labeler.yml
# Метки создаются вручную один раз: docs/security/github-labels.md
#
# pull_request_target: labeler не выполняет код из PR; только сопоставляет пути.
name: Pull Request Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  labeler:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v6
