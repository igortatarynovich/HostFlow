name: docs-gates
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.md"
      - "AGENTS.md"
      - "docs/**"
      - "archive/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-gates.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "scripts/docs/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  docs-governance-gate:
    name: Documentation governance lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run docs governance lint (baseline-aware)
        run: python3 scripts/docs/check_doc_governance.py
