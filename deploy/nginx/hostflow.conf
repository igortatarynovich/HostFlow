# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name hostflow.cc www.hostflow.cc;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name hostflow.cc www.hostflow.cc;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/hostflow.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostflow.cc/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Allow uploads up to 10 megabytes (was 1 MB by default).
    client_max_body_size 10m;
    add_header Content-Security-Policy "child-src 'self' blob:; frame-src 'self' blob:" always;

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000/api/;
    }

    # Proxy public API routes to backend, but exclude frontend routes
    # Frontend routes: /public/scan (without subpath), /public/apply/:token, /public/status/:token, /public/intake, /public/portal
    # API routes: /public/scan-sessions/*, /public/scan/presets, /public/apply/* (API), /public/status/* (API), etc.
    
    # Proxy scan-sessions API to backend
    location ~ ^/public/scan-sessions {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    
    # Proxy /public/scan/presets API to backend (exact match, not /public/scan itself)
    location = /public/scan/presets {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }
    
    # Proxy other public API routes (apply, status, magic-link, intake API endpoints) to backend
    # But exclude frontend routes like /public/apply/:token (handled by frontend)
    location ~ ^/public/(apply|status|magic-link|intake)/ {
        # Check if it's an API endpoint (has specific patterns) or frontend route
        # For now, proxy all - frontend routes will be handled by React Router
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:8000;
    }

    # Hashed Vite chunks — safe to cache forever; avoids stale shell pointing at missing files only if index.html is not cached.
    location /assets/ {
        root /var/www/hostflow-frontend;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "child-src 'self' blob:; frame-src 'self' blob:" always;
        # SPA shell must not be cached long: old index.html references old chunk hashes → 404 on lazy imports.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        root /var/www/hostflow-frontend;
        try_files $uri $uri/ /index.html;
    }
}
