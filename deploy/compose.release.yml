# Throwaway / release stack for OL-2. Does not replace docker-compose.yml.
#
# Differences from the production compose that are intentional and named:
# - backend image is built from the repo root and is not bind-mounted;
# - frontend is served from an immutable published tree, not the checkout dist/;
# - env_file is an absolute path outside every build context (OL-2 / R-2).
#
# Usage (from repo root, after scripts/deploy/build-release-artefacts.sh):
#   docker compose -f deploy/compose.release.yml up -d

name: hostflow-release

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hostflow
      POSTGRES_PASSWORD: hostflow
      POSTGRES_DB: hostflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hostflow -d hostflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${HOSTFLOW_BACKEND_IMAGE:-hostflow-backend:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        GIT_REF: ${GIT_REF:-}
        BUILD_TIME: ${BUILD_TIME:-}
    restart: unless-stopped
    env_file:
      - ${HOSTFLOW_ENV_FILE:-/etc/hostflow/env}
    environment:
      DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      ASYNC_DATABASE_URL: postgresql+asyncpg://hostflow:hostflow@db:5432/hostflow
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      SYNC_DATABASE_URL: postgresql+psycopg://hostflow:hostflow@db:5432/hostflow
      REDIS_URL: redis://redis:6379/0
      HOSTFLOW_REVISION: ${GIT_SHA:-unknown}
      HOSTFLOW_VERSION: ${GIT_REF:-}
      HOSTFLOW_BUILT_AT: ${BUILD_TIME:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8000'"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    # No source bind mounts. Code is the image.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HOSTFLOW_HTTP_PORT:-8088}:80"
    volumes:
      - ./Caddyfile.release:/etc/caddy/Caddyfile:ro
      - ${HOSTFLOW_FRONTEND_ROOT:-/var/lib/hostflow/releases/frontend/current}:/var/www/hostflow-frontend:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
