<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Hostflow API Smoke UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- глушим 404 favicon -->
  <link rel="icon" href="data:," />
  <style>
    body { font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 16px; }
    h2 { margin-top: 24px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    fieldset { border: 1px solid #ddd; border-radius: 12px; padding:12px; }
    input, select, textarea { width: 100%; padding: 8px; border:1px solid #ccc; border-radius:8px; }
    button { padding: 8px 12px; border: 0; border-radius: 10px; background: #111; color: #fff; cursor: pointer; }
    button + button { margin-left: 8px; }
    .muted { color:#666; }
    pre { background:#111; color:#0f0; padding:12px; border-radius:8px; overflow:auto; max-height: 40vh;}
    .grid-3 { display:grid; gap:16px; grid-template-columns: repeat(3, 1fr); }
    label { display:block; margin:8px 0 4px; font-weight:600; }
    .inline { display:flex; gap:8px; align-items:center; }
    .inline input { flex:1 }
  </style>
</head>
<body>
  <h1>Hostflow — быстрый фронт для теста API</h1>

  <fieldset>
    <legend>Настройки</legend>

    <label>API base URL</label>
    <input id="api" value="http://localhost:8000/api/v1" />

    <label>Bearer Token (<span class="muted">MANAGER_TOKEN или VIEWER_TOKEN</span>)</label>
    <input id="token" placeholder="MANAGER_TOKEN или VIEWER_TOKEN" />

    <label>Candidate ID</label>
    <div class="inline">
      <input id="cid" placeholder="uuid кандидата" />
      <button onclick="autofillCandidate()">Get first candidate</button>
    </div>
  </fieldset>

  <div class="row">
    <fieldset>
      <legend>Documents</legend>
      <div class="grid-3">
        <div>
          <label>doc_type</label>
          <input id="doc_type" value="passport" />
        </div>
        <div>
          <label>status</label>
          <select id="doc_status">
            <option>pending</option>
            <option>approved</option>
            <option>rejected</option>
          </select>
        </div>
        <div>
          <label>files (JSON)</label>
          <input id="doc_files" value='{"front":"file-1.png"}' />
        </div>
      </div>
      <div style="margin-top:8px">
        <button onclick="listDocs()">List</button>
        <button onclick="createDoc()">Create</button>
        <input id="doc_id" placeholder="document id для patch/delete" style="width: 50%" />
        <button onclick="patchDoc()">Patch status→approved</button>
        <button onclick="deleteDoc()">Delete</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Permits</legend>
      <div class="grid-3">
        <div>
          <label>permit_type</label>
          <select id="permit_type">
            <option>work_permit</option>
            <option>residence</option>
            <option>other</option>
          </select>
        </div>
        <div>
          <label>number</label>
          <input id="permit_number" value="WP-123" />
        </div>
        <div>
          <label>status</label>
          <select id="permit_status">
            <option>requested</option>
            <option>in_progress</option>
            <option>issued</option>
            <option>expired</option>
            <option>rejected</option>
          </select>
        </div>
        <div>
          <label>issued_on (YYYY-MM-DD)</label>
          <input id="permit_issued_on" type="date" />
        </div>
        <div>
          <label>expires_on (YYYY-MM-DD)</label>
          <input id="permit_expires_on" type="date" />
        </div>
        <div>
          <label>meta (JSON)</label>
          <input id="permit_meta" value='{}' />
        </div>
      </div>
      <div style="margin-top:8px">
        <button onclick="listPermits()">List</button>
        <button onclick="createPermit()">Create</button>
        <input id="permit_id" placeholder="permit id" style="width: 50%" />
        <button onclick="patchPermit()">Patch status→issued</button>
        <button onclick="deletePermit()">Delete</button>
      </div>
    </fieldset>
  </div>

  <div class="row">
    <fieldset>
      <legend>Visas</legend>
      <div class="grid-3">
        <div>
          <label>visa_type</label>
          <select id="visa_type">
            <option>schengen</option>
            <option>national</option>
            <option>other</option>
          </select>
        </div>
        <div>
          <label>number</label>
          <input id="visa_number" value="V-999" />
        </div>
        <div>
          <label>status</label>
          <select id="visa_status">
            <option>planned</option>
            <option>submitted</option>
            <option>issued</option>
            <option>refused</option>
            <option>expired</option>
          </select>
        </div>
        <div>
          <label>issued_on</label>
          <input id="visa_issued_on" type="date" />
        </div>
        <div>
          <label>expires_on</label>
          <input id="visa_expires_on" type="date" />
        </div>
        <div>
          <label>checkpoints (JSON)</label>
          <input id="visa_checkpoints" value='{"appointment":"2025-08-25"}' />
        </div>
        <div>
          <label>meta (JSON)</label>
          <input id="visa_meta" value='{}' />
        </div>
      </div>
      <div style="margin-top:8px">
        <button onclick="listVisas()">List</button>
        <button onclick="createVisa()">Create</button>
        <input id="visa_id" placeholder="visa id" style="width: 50%" />
        <button onclick="patchVisa()">Patch status→submitted + checkpoints</button>
        <button onclick="deleteVisa()">Delete</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Tasks</legend>
      <div class="grid-3">
        <div>
          <label>title</label>
          <input id="task_title" value="Позвонить кандидату" />
        </div>
        <div>
          <label>due_date</label>
          <input id="task_due_date" type="date" />
        </div>
        <div>
          <label>priority</label>
          <select id="task_priority">
            <option>low</option>
            <option selected>normal</option>
            <option>high</option>
            <option>urgent</option>
          </select>
        </div>
        <div>
          <label>assigned_to</label>
          <input id="task_assigned_to" value="ManagerName" />
        </div>
        <div>
          <label>description</label>
          <input id="task_desc" placeholder="опционально" />
        </div>
        <div>
          <label>meta (JSON)</label>
          <input id="task_meta" value='{}' />
        </div>
      </div>
      <div style="margin-top:8px">
        <button onclick="listTasks()">List</button>
        <button onclick="createTask()">Create</button>
        <input id="task_id" placeholder="task id" style="width: 50%" />
        <button onclick="patchTask()">Patch completed→true</button>
        <button onclick="deleteTask()">Delete</button>
      </div>
    </fieldset>
  </div>

  <h2>Ответ</h2>
  <pre id="out">...</pre>

  <script>
  const el = id => document.getElementById(id);
  const show = v => el('out').textContent = typeof v === 'string' ? v : JSON.stringify(v, null, 2);

  function base() {
    const API = el('api').value.replace(/\/$/, '');
    const cid = el('cid').value.trim();
    const token = el('token').value.trim();
    if (!API || !cid || !token) throw new Error('Заполни API, Candidate ID и Token');
    return { API, cid, token };
  }

  async function req(path, opts = {}) {
    try {
      const { API, token } = base();
      const res = await fetch(`${API}${path}`, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...(opts.headers || {})
        }
      });
      const text = await res.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = text; }

      if (!res.ok) {
        show({ status: res.status, data });
        throw new Error(`HTTP ${res.status}`);
      }
      show(data ?? { ok: true });
      return data;
    } catch (e) {
      show({ error: String(e), hint: 'Проверь CORS, URL API, токен и Candidate ID' });
      throw e;
    }
  }

  // Быстро подставить первого кандидата
  async function autofillCandidate() {
    const API = el('api').value.replace(/\/$/, '');
    const token = el('token').value.trim();
    if (!API || !token) {
      show({ error: 'Сначала заполните API и Token' });
      return;
    }
    try {
      const res = await fetch(`${API}/candidates?limit=1`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const arr = await res.json();
      if (Array.isArray(arr) && arr[0]?.id) {
        el('cid').value = arr[0].id;
        show({ info: 'CID заполнен', id: arr[0].id });
      } else {
        show({ error: 'Не удалось получить кандидата' });
      }
    } catch (e) {
      show({ error: String(e) });
    }
  }

  // Documents
  const listDocs   = () => req(`/candidates/${base().cid}/documents`);
  const createDoc  = () => req(`/candidates/${base().cid}/documents`, {
    method: 'POST',
    body: JSON.stringify({
      doc_type: el('doc_type').value,
      status: el('doc_status').value,
      files: JSON.parse(el('doc_files').value || '{}')
    })
  });
  const patchDoc   = () => req(`/candidates/${base().cid}/documents/${el('doc_id').value}`, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'approved' })
  });
  const deleteDoc  = () => req(`/candidates/${base().cid}/documents/${el('doc_id').value}`, {
    method: 'DELETE'
  });

  // Permits
  const listPermits = () => req(`/candidates/${base().cid}/permits`);
  const createPermit = () => req(`/candidates/${base().cid}/permits`, {
    method: 'POST',
    body: JSON.stringify({
      permit_type: el('permit_type').value,
      number: el('permit_number').value || null,
      issued_on: el('permit_issued_on').value || null,
      expires_on: el('permit_expires_on').value || null,
      status: el('permit_status').value,
      meta: JSON.parse(el('permit_meta').value || '{}')
    })
  });
  const patchPermit = () => req(`/candidates/${base().cid}/permits/${el('permit_id').value}`, {
    method: 'PATCH',
    body: JSON.stringify({ status: 'issued', expires_on: (new Date().getFullYear()+1) + '-12-31' })
  });
  const deletePermit = () => req(`/candidates/${base().cid}/permits/${el('permit_id').value}`, { method: 'DELETE' });

  // Visas
  const listVisas = () => req(`/candidates/${base().cid}/visas`);
  const createVisa = () => req(`/candidates/${base().cid}/visas`, {
    method: 'POST',
    body: JSON.stringify({
      visa_type: el('visa_type').value,
      number: el('visa_number').value || null,
      issued_on: el('visa_issued_on').value || null,
      expires_on: el('visa_expires_on').value || null,
      status: el('visa_status').value,
      checkpoints: JSON.parse(el('visa_checkpoints').value || '{}'),
      meta: JSON.parse(el('visa_meta').value || '{}'),
    })
  });
  const patchVisa = () => req(`/candidates/${base().cid}/visas/${el('visa_id').value}`, {
    method: 'PATCH',
    body: JSON.stringify({
      status: 'submitted',
      checkpoints: { ...JSON.parse(el('visa_checkpoints').value || '{}'), biometrics: '2025-08-27' }
    })
  });
  const deleteVisa = () => req(`/candidates/${base().cid}/visas/${el('visa_id').value}`, { method: 'DELETE' });

  // Tasks
  const listTasks = () => req(`/candidates/${base().cid}/tasks`);
  const createTask = () => req(`/candidates/${base().cid}/tasks`, {
    method: 'POST',
    body: JSON.stringify({
      title: el('task_title').value,
      description: el('task_desc').value || null,
      due_date: el('task_due_date').value || null,
      completed: false,
      priority: el('task_priority').value,
      assigned_to: el('task_assigned_to').value || null,
      meta: JSON.parse(el('task_meta').value || '{}')
    })
  });
  const patchTask = () => req(`/candidates/${base().cid}/tasks/${el('task_id').value}`, {
    method: 'PATCH',
    body: JSON.stringify({ completed: true })
  });
  const deleteTask = () => req(`/candidates/${base().cid}/tasks/${el('task_id').value}`, { method: 'DELETE' });
  </script>
</body>
</html>
