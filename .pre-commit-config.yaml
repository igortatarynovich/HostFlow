repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black]

  - repo: local
    hooks:
      - id: alembic-heads
        name: alembic heads must be exactly 1
        entry: python3 backend/scripts/check_alembic_heads.py --quiet
        language: system
        pass_filenames: false
        files: ^backend/alembic/versions/.*\.py$