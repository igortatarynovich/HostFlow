[alembic]
script_location = backend/alembic
timezone = UTC
output_encoding = utf-8

# ВНИМАНИЕ: это резервный URL для Alembic.
# В реальном окружении будет переопределён переменными окружения
# (SYNC_DATABASE_URL/DATABASE_URL/ALEMBIC_DATABASE_URL) или из app.core.settings.
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s